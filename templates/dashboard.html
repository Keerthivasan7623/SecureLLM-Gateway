<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Guardrail | Secure Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-black: #050505;
            --apple-gray: #1d1d1f;
            --apple-light-gray: #424245;
            --apple-blue: #0A84FF;
            --apple-red: #FF453A;
            --apple-green: #30D158;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--apple-black);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .navbar {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            z-index: 10;
        }

        .navbar h1 {
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(90deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .settings-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .settings-btn:hover { background: rgba(255,255,255,0.1); }

        .chat-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease-out;
            word-wrap: break-word;
        }

        .msg-user {
            align-self: flex-end;
            background: var(--apple-blue);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-ai {
            align-self: flex-start;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
        }

        .msg-blocked {
            align-self: flex-start;
            background: rgba(255, 69, 58, 0.15);
            border: 1px solid var(--apple-red);
            color: #ffb3b0;
            border-bottom-left-radius: 4px;
        }

        .blocked-reason {
            font-size: 0.75rem;
            margin-top: 5px;
            color: var(--apple-red);
            font-weight: 600;
        }

        .input-area {
            padding: 20px;
            background: var(--glass);
            border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .input-wrapper input {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 14px 20px;
            border-radius: 25px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        .input-wrapper input:focus { border-color: var(--apple-blue); }

        .send-btn {
            background: var(--apple-blue);
            border: none;
            color: white;
            padding: 0 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .send-btn:hover { opacity: 0.8; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111;
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
        }
        .modal-content h2 { margin-bottom: 15px; font-size: 1.2rem; }
        .modal-content label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #aaa; }
        .modal-content select, .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #222;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            outline: none;
        }
        .modal-btn {
            width: 100%;
            padding: 10px;
            background: var(--apple-blue);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading {
            align-self: flex-start;
            color: #aaa;
            font-size: 0.85rem;
            font-style: italic;
            display: none;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <h1>Guardrail Proxy Chat</h1>
        <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
    </div>

    <div class="chat-container" id="chat">
        <div class="message msg-ai">Hello! I am protected by the 3-Tier Guardrail. You can chat with me securely. Please set your API key in Settings first!</div>
    </div>
    <div class="loading" id="loading">Guardrail scanning & waiting for AI...</div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="prompt-input" placeholder="Type a secure message..." onkeypress="handleEnter(event)">
            <button class="send-btn" onclick="sendPrompt()">Send</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h2>LLM Provider Settings</h2>
            <label>Provider</label>
            <select id="provider-select">
                <option value="openai">OpenAI (ChatGPT)</option>
                <option value="gemini">Google (Gemini)</option>
            </select>
            <label>API Key (Stored only in your browser)</label>
            <input type="password" id="apikey-input" placeholder="Paste your API Key here...">
            <button class="modal-btn" onclick="saveSettings()">Save & Close</button>
        </div>
    </div>

    <script>
        // Load settings
        let provider = localStorage.getItem('llm_provider') || 'openai';
        let apiKey = localStorage.getItem('llm_apikey') || '';

        function openSettings() {
            document.getElementById('provider-select').value = provider;
            document.getElementById('apikey-input').value = apiKey;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function saveSettings() {
            provider = document.getElementById('provider-select').value;
            apiKey = document.getElementById('apikey-input').value;
            localStorage.setItem('llm_provider', provider);
            localStorage.setItem('llm_apikey', apiKey);
            document.getElementById('settings-modal').style.display = 'none';
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendPrompt();
        }

        async function sendPrompt() {
            const input = document.getElementById('prompt-input');
            const prompt = input.value.trim();
            if (!prompt) return;

            if (!apiKey) {
                alert("Please configure your API Key in Settings first.");
                openSettings();
                return;
            }

            appendMessage(prompt, 'msg-user');
            input.value = '';
            
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, provider, api_key: apiKey })
                });
                
                const data = await response.json();
                loading.style.display = 'none';

                if (data.status === 'BLOCKED') {
                    const blockMsg = `<b>Request Terminated</b><br>Your prompt was intercepted by the Guardrail.<br><div class="blocked-reason">Reason: ${data.reason}</div>`;
                    appendMessage(blockMsg, 'msg-blocked', true);
                } else {
                    appendMessage(data.llm_response, 'msg-ai');
                }
            } catch (err) {
                loading.style.display = 'none';
                appendMessage("Error connecting to server.", 'msg-blocked');
            }
        }

        function appendMessage(text, className, isHTML=false) {
            const chat = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = `message ${className}`;
            if (isHTML) {
                msg.innerHTML = text;
            } else {
                msg.innerText = text;
            }
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>

</html>
